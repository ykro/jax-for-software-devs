<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="composable-transforms-title composable-transforms-desc" id="d-03-composable-transforms-pipeline-root">
        <title id="composable-transforms-title">JAX composable transformations pipeline</title>
        <desc id="composable-transforms-desc">Dataflow across Python Domain Logic, JAX Autodiff, JAX Batch Vectorizer, and OpenXLA PJRT Runtime showing how a single-record function f(x) composes with value_and_grad, vmap, and jit into one compiled executable. vmap matches hand-vectorized NumPy without rewriting f; the large speedup is against a Python for-loop.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-03-composable-transforms-pipeline-root { --paper: #F7F6F2; --paper-2: #EFECE6; --ink: #0F2547; --muted: #3B5B8C;
      --soft: #5A76A3; --rule: rgba(15,37,71,0.14); --accent: #C59216;
      --accent-text: #9A6F0B; --accent-tint: rgba(197,146,22,0.12); --link: #1D4ED8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #d-03-composable-transforms-pipeline-root { color: var(--ink); font-family: var(--sans); }
      #d-03-composable-transforms-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-03-composable-transforms-pipeline-root .step-number, #d-03-composable-transforms-pipeline-root .step-label, #d-03-composable-transforms-pipeline-root .lane-label, #d-03-composable-transforms-pipeline-root .role-text, #d-03-composable-transforms-pipeline-root .chip-text, #d-03-composable-transforms-pipeline-root .legend-label { font-family: var(--mono); text-anchor: middle; }
      #d-03-composable-transforms-pipeline-root .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; dominant-baseline: central; }
      #d-03-composable-transforms-pipeline-root .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
      #d-03-composable-transforms-pipeline-root .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
      #d-03-composable-transforms-pipeline-root .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; dominant-baseline: central; }
      #d-03-composable-transforms-pipeline-root .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
      #d-03-composable-transforms-pipeline-root .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
      #d-03-composable-transforms-pipeline-root .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
      #d-03-composable-transforms-pipeline-root .chip-text { fill: #fff; font-size: 5px; font-weight: 700; dominant-baseline: central; }
      #d-03-composable-transforms-pipeline-root .focal-text { fill: var(--accent-text); }
      #d-03-composable-transforms-pipeline-root .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
      #d-03-composable-transforms-pipeline-root .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
      #d-03-composable-transforms-pipeline-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-03-composable-transforms-pipeline-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="#0f2547" fill-opacity="0.10"/></pattern>
          <marker id="d-03-composable-transforms-pipeline-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3B5B8C"/></marker>
          <marker id="d-03-composable-transforms-pipeline-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#C59216"/></marker>
          <marker id="d-03-composable-transforms-pipeline-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#1D4ED8"/></marker>
        </defs>
        <rect width="728" height="436" fill="#F7F6F2"/>
        <rect width="728" height="436" fill="url(#d-03-composable-transforms-pipeline-dots)"/>
        <rect x="0" y="36" width="728" height="80" fill="#0f2547" fill-opacity="0.02"/>
        <rect x="0" y="196" width="728" height="80" fill="#0f2547" fill-opacity="0.02"/>

        <!-- Header and lane hairlines -->
        <line x1="0" y1="36" x2="728" y2="36" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="116" x2="728" y2="116" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="196" x2="728" y2="196" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="276" x2="728" y2="276" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="356" x2="728" y2="356" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="140" y1="36" x2="140" y2="356" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>

        <g aria-label="Pipeline steps">
          <rect x="180" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">PURE FN</text>
          <rect x="292" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">GRAD</text>
          <rect x="404" y="6" width="32" height="16" rx="8" fill="#c59216" fill-opacity="0.20"/><text x="420" y="14" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">VMAP</text>
          <rect x="516" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">JIT HLO</text>
          <rect x="628" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">PJRT</text>
        </g>

        <g aria-label="Role lanes">
          <text x="70" y="72" class="lane-label">DOMAIN</text><text x="70" y="84" class="lane-label">PYTHON</text>
          <text x="70" y="152" class="lane-label">AUTODIFF</text><text x="70" y="164" class="lane-label">TRANSFORM</text>
          <text x="70" y="232" class="lane-label">VECTOR</text><text x="70" y="244" class="lane-label">BATCHER</text>
          <text x="70" y="312" class="lane-label">OPENXLA</text><text x="70" y="324" class="lane-label">RUNTIME</text>
        </g>

        <!-- Connectors before nodes (orthogonal r=8 elbows) -->
        <path d="M246 76 H300 Q308 76 308 84 V124" fill="none" stroke="#3B5B8C" marker-end="url(#d-03-composable-transforms-pipeline-arr-muted)"/>
        <path d="M358 156 H412 Q420 156 420 164 V204" fill="none" stroke="#C59216" stroke-width="1.3" marker-end="url(#d-03-composable-transforms-pipeline-arr-accent)"/>
        <path d="M470 236 H482" fill="none" stroke="#3B5B8C" marker-end="url(#d-03-composable-transforms-pipeline-arr-muted)"/>
        <path d="M582 236 H636 Q644 236 644 244 V284" fill="none" stroke="#1D4ED8" marker-end="url(#d-03-composable-transforms-pipeline-arr-link)"/>

        <rect x="364" y="138" width="52" height="12" rx="2" fill="#F7F6F2"/>
        <text x="390" y="147" fill="#9A6F0B" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AXIS 0</text>

        <!-- Node 1: Domain Python / Pure 1D Function -->
        <rect x="146" y="44" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="150" y="48" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="159" y="53" class="role-text">FN</text>
        <text x="196" y="67" class="node-title">Scalar Function</text><text x="196" y="79" class="node-sub">f(params, x_1d)</text><text x="196" y="91" class="node-tool">zero for-loops</text>
        <rect x="150" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="158" y="104" class="chip-text">1D</text>
        <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="104" class="chip-text">1D</text>

        <!-- Node 2: Autodiff / value_and_grad -->
        <rect x="258" y="124" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="262" y="128" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="271" y="133" class="role-text">AD</text>
        <text x="308" y="147" class="node-title">value_and_grad</text><text x="308" y="159" class="node-sub">df/dp to fp32 rounding</text><text x="308" y="171" class="node-tool">forward + backward</text>
        <rect x="262" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="270" y="184" class="chip-text">1D</text>
        <rect x="338" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="346" y="184" class="chip-text">GR</text>

        <!-- Node 3: Vector Batcher / jax.vmap (FOCAL) -->
        <rect x="370" y="204" width="100" height="64" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.4"/>
        <rect x="374" y="208" width="18" height="10" rx="3" fill="#c59216" fill-opacity="0.22"/><text x="383" y="213" class="role-text focal-text">VM</text>
        <text x="420" y="227" class="node-title">jax.vmap Batcher</text><text x="420" y="239" class="node-sub">10,000 records</text><text x="420" y="251" class="node-tool">214x loop · 2.0x NumPy</text>
        <rect x="374" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="382" y="264" class="chip-text">GR</text>
        <rect x="450" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="264" class="chip-text">BT</text>

        <!-- Node 4: Vector Batcher / @jax.jit Lowering -->
        <rect x="482" y="204" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="486" y="208" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="495" y="213" class="role-text">JIT</text>
        <text x="532" y="227" class="node-title">@jax.jit Fusion</text><text x="532" y="239" class="node-sub">Jaxpr → StableHLO</text><text x="532" y="251" class="node-tool">whole-graph IR</text>
        <rect x="486" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="494" y="264" class="chip-text">BT</text>
        <rect x="562" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="570" y="264" class="chip-text">BT</text>

        <!-- Node 5: OpenXLA Runtime / PJRT Execution -->
        <rect x="594" y="284" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="598" y="288" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="607" y="293" class="role-text">XLA</text>
        <text x="644" y="307" class="node-title">PJRT Executable</text><text x="644" y="319" class="node-sub">CPU / GPU / TPU</text><text x="644" y="331" class="node-tool">1 compiled dispatch</text>
        <rect x="598" y="338" width="16" height="8" rx="3" fill="#b8915a"/><text x="606" y="344" class="chip-text">BT</text>
        <rect x="674" y="338" width="16" height="8" rx="3" fill="#9c6b50"/><text x="682" y="344" class="chip-text">OUT</text>

        <!-- Legend: steps -->
        <text x="164" y="373" class="legend-label">STEPS</text>
        <rect x="180" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="192" y="372" class="step-number">01</text><text x="212" y="373" class="legend-text">Pure fn</text>
        <rect x="272" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="284" y="372" class="step-number">02</text><text x="304" y="373" class="legend-text">grad</text>
        <rect x="360" y="364" width="24" height="12" rx="6" fill="#c59216" fill-opacity="0.20"/><text x="372" y="372" class="step-number focal-text">03</text><text x="392" y="373" class="legend-text">vmap</text>
        <rect x="456" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="468" y="372" class="step-number">04</text><text x="488" y="373" class="legend-text">jit</text>
        <rect x="556" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="568" y="372" class="step-number">05</text><text x="588" y="373" class="legend-text">Execute</text>

        <!-- Legend: data types -->
        <text x="164" y="394" class="legend-label">DATA TYPE</text>
        <rect x="180" y="386" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="188" y="392" class="chip-text">1D</text><text x="202" y="394" class="legend-text">Single record</text>
        <rect x="288" y="386" width="16" height="8" rx="3" fill="#b8915a"/><text x="296" y="392" class="chip-text">BT</text><text x="310" y="394" class="legend-text">Batched grad IR</text>
        <rect x="404" y="386" width="16" height="8" rx="3" fill="#9c6b50"/><text x="412" y="392" class="chip-text">OUT</text><text x="426" y="394" class="legend-text">PJRT batch output</text>
        <text x="520" y="394" class="legend-text">left chip = input · right chip = output</text>

        <!-- Legend: flow -->
        <text x="164" y="416" class="legend-label">FLOW</text>
        <line x1="180" y1="413" x2="204" y2="413" stroke="#3B5B8C" marker-end="url(#d-03-composable-transforms-pipeline-arr-muted)"/><text x="212" y="416" class="legend-text">Function transform</text>
        <line x1="308" y1="413" x2="332" y2="413" stroke="#C59216" stroke-width="1.3" marker-end="url(#d-03-composable-transforms-pipeline-arr-accent)"/><text x="340" y="416" class="legend-text">Focal batch pushdown</text>
        <line x1="460" y1="413" x2="484" y2="413" stroke="#1D4ED8" marker-end="url(#d-03-composable-transforms-pipeline-arr-link)"/><text x="492" y="416" class="legend-text">PJRT binary dispatch</text>
      </svg>
