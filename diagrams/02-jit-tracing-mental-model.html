<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>How @jax.jit Thinks: Tracing vs Cached Execution · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #F7F6F2;
      --color-paper-2: #EFECE6;
      --color-ink: #0F2547;
      --color-muted: #3B5B8C;
      --color-accent: #C59216;
      --color-accent-text: #9A6F0B;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem;
    }
    .frame { max-width: 1120px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>

        <line x1="372" y1="224" x2="628" y2="224" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="628" y1="268" x2="372" y2="268" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="372" y1="312" x2="892" y2="312" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#arrow)"/>

        <text x="368" y="96" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">@jax.jit Cache</text>
        <text x="368" y="111" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">key=(shape, dtype)</text>

        <rect x="552" y="64" width="160" height="56" rx="6" fill="#EFECE6" stroke="#3B5B8C" stroke-width="1.2"/>

        <rect x="816" y="64" width="160" height="56" rx="6" fill="rgba(197,146,22,0.12)" stroke="#C59216" stroke-width="1.4"/>
